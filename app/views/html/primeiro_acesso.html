<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro Acesso | FUNFARME</title>
    <style>
        :root {
            --funfarme-blue: #1e3a8a;
            --funfarme-blue-dark: #172554;
            --funfarme-blue-hover: #1d4ed8;
            --accent: #0284c7;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background: linear-gradient(145deg, #1e3a8a 0%, #172554 100%);
            background-image:
                radial-gradient(circle at 20% 15%, rgba(56, 189, 248, 0.16), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(2, 132, 199, 0.18), transparent 45%),
                linear-gradient(145deg, #1e3a8a 0%, #172554 100%);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-top {
            height: 120px;
            width: auto;
            object-fit: contain;
            margin-bottom: 22px;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
        }

        .card {
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 22px 45px rgba(2, 6, 23, 0.38);
        }

        .card-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .icon-badge {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: linear-gradient(135deg, #1e3a8a, #0284c7);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px auto;
            box-shadow: 0 6px 16px rgba(30, 58, 138, 0.25);
        }

        .card-header h1 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--funfarme-blue);
            letter-spacing: -0.3px;
        }

        .card-header p {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 5px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: var(--funfarme-blue);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.14);
        }

        .input-codigo {
            font-family: monospace;
            font-size: 1rem !important;
            font-weight: 800;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--funfarme-blue) !important;
            background: #f8fafc !important;
        }

        .toggle-pass {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 2px;
        }
        .toggle-pass:hover { color: var(--funfarme-blue); }

        .btn-submit {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
            color: #ffffff;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(30, 58, 138, 0.28);
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 22px rgba(30, 58, 138, 0.35);
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            display: none;
        }
        .alert-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .alert-success { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }

        .footer-link {
            text-align: center;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .footer-link a {
            color: var(--funfarme-blue);
            font-weight: 700;
            text-decoration: none;
        }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="wrapper">
        <img
            src="{{ url_for('static', filename='img/Logo_funfarme.png') }}"
            onerror="this.onerror=null; this.src='../img/Logo_funfarme.png';"
            alt="FUNFARME"
            class="logo-top"
        >

        <div class="card">
            <div class="card-header">
                <div class="icon-badge">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                    </svg>
                </div>
                <h1>Primeiro Acesso</h1>
                <p>Valide seu convite e crie sua senha</p>
            </div>

            <form id="form-primeiro-acesso">
                <div class="form-group">
                    <label for="codigo_convite">Código do Convite</label>
                    <input type="text" id="codigo_convite" class="input-codigo" required maxlength="16" placeholder="A1B2C3D4" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" inputmode="numeric" required maxlength="14" placeholder="000.000.000-00">
                </div>

                <div class="form-group">
                    <label for="senha">Nova Senha</label>
                    <div class="input-wrap">
                        <input type="password" id="senha" required minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                        <button type="button" class="toggle-pass" onclick="alternarVisibilidade('senha')" title="Mostrar/Ocultar">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmar_senha">Confirmar Senha</label>
                    <div class="input-wrap">
                        <input type="password" id="confirmar_senha" required minlength="6" placeholder="Repita a senha" autocomplete="new-password">
                        <button type="button" class="toggle-pass" onclick="alternarVisibilidade('confirmar_senha')" title="Mostrar/Ocultar">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btn-ativar">Ativar Acesso</button>
            </form>

            <div id="alert-box" class="alert"></div>

            <div class="footer-link">
                Já tem acesso? <a href="/login">Entrar</a>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const codigoUrl = params.get("codigo");
        if (codigoUrl) {
            document.getElementById("codigo_convite").value = codigoUrl.trim().toUpperCase();
        }

        function alternarVisibilidade(idCampo) {
            const input = document.getElementById(idCampo);
            input.type = input.type === "password" ? "text" : "password";
        }

        document.getElementById("cpf").addEventListener("input", (e) => {
            let v = e.target.value.replace(/\D/g, "").slice(0, 11);
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            e.target.value = v;
        });

        function exibirAlerta(msg, sucesso = false) {
            const box = document.getElementById("alert-box");
            box.className = sucesso ? "alert alert-success" : "alert alert-danger";
            box.innerText = msg;
            box.style.display = "block";
        }

        document.getElementById("form-primeiro-acesso").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("btn-ativar");
            if (btn.disabled) return;

            const codigo_convite = document.getElementById("codigo_convite").value.trim().toUpperCase();
            const cpf = document.getElementById("cpf").value.replace(/\D/g, "");
            const senha = document.getElementById("senha").value;
            const confirmar_senha = document.getElementById("confirmar_senha").value;

            document.getElementById("alert-box").style.display = "none";

            if (cpf.length !== 11) {
                exibirAlerta("CPF inválido.");
                return;
            }
            if (senha.length < 6) {
                exibirAlerta("Senha mínima de 6 caracteres.");
                return;
            }
            if (senha !== confirmar_senha) {
                exibirAlerta("As senhas não conferem.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Ativando...";

            try {
                const res = await fetch("/api/primeiro-acesso", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ codigo_convite, cpf, senha })
                });

                const data = await res.json();

                if (res.ok && data.sucesso) {
                    exibirAlerta("Acesso ativado! Redirecionando...", true);
                    setTimeout(() => { window.location.href = "/login"; }, 1400);
                } else {
                    exibirAlerta(data.mensagem || "Código ou CPF inválido.");
                    btn.disabled = false;
                    btn.innerText = "Ativar Acesso";
                }
            } catch (err) {
                exibirAlerta("Erro ao conectar com o servidor.");
                btn.disabled = false;
                btn.innerText = "Ativar Acesso";
            }
        });
    </script>
</body>
</html>
